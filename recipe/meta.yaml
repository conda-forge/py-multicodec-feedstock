{% set name = "py-multicodec" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9e3f07e17cb047b2a058a049f70ee00751faadbff104c939d1358679295e138a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pytest-runner
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - varint >=1.0.2,<2.0.0

test:
  imports:
    - multicodec
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/multiformats/py-multicodec
  summary: Multicodec implementation in Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
